<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFCFB; --grid:#DFEAF1; --ink:#1B3D6D; --soft:#5B7291; --line:#BCCDDC; --card:#FFFFFF;
  --a:#E4730F; --a-bg:#FDE8D3; --b:#7348C9; --b-bg:#EDE4FB; --w:#1B3D6D; --w-bg:#DCE7F5;
  --hi:#FFE66B; --ok:#1E8A4C; --ok-bg:#DDF3E5; --bad:#C0392B; --empty:#EEF3F7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121B26; --grid:#1B2837; --ink:#E6EEF8; --soft:#9DB0C8; --line:#34475F; --card:#172230;
    --a:#FF9C4A; --a-bg:#3B2715; --b:#AE8BF5; --b-bg:#2A2142; --w:#93BBF2; --w-bg:#1C2D47;
    --hi:rgba(255,222,70,.30); --ok:#62D194; --ok-bg:#16362A; --bad:#FF7B6B; --empty:#1E2B3B;
  }
}
:root[data-theme="dark"]{
  --paper:#121B26; --grid:#1B2837; --ink:#E6EEF8; --soft:#9DB0C8; --line:#34475F; --card:#172230;
  --a:#FF9C4A; --a-bg:#3B2715; --b:#AE8BF5; --b-bg:#2A2142; --w:#93BBF2; --w-bg:#1C2D47;
  --hi:rgba(255,222,70,.30); --ok:#62D194; --ok-bg:#16362A; --bad:#FF7B6B; --empty:#1E2B3B;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:1.0625rem; line-height:1.5;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 48px}

/* Top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 10px}
.bar h1{font-size:1.25rem;margin:0 auto 0 0;font-weight:700;letter-spacing:.01em}
.tabs{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;min-width:40px;height:40px;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;padding:0 10px}
.iconbtn svg{width:20px;height:20px}

/* Practice */
.status{display:flex;justify-content:space-between;align-items:center;min-height:32px;color:var(--soft);font-weight:700}
.stars{color:var(--a);font-size:1.15rem;display:inline-block}
.stars.bump{animation:pop .45s ease}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.dots{display:flex;gap:6px}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--b)}
.dots span.on{background:var(--b)}

.eq{display:flex;justify-content:center;align-items:center;gap:.28em;flex-wrap:nowrap;
  font-size:clamp(2.8rem,13vw,5.6rem);font-weight:700;line-height:1;padding:28px 0 18px;user-select:none}
.eq.wide{font-size:clamp(2rem,9.5vw,4.6rem)}
.eq .op{color:var(--soft);font-weight:400}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.45em;height:1.3em;padding:0 .12em;
  border:4px dashed var(--ink);border-radius:.22em;background:var(--card)}
.box.filled{border-style:solid}
.box.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);animation:pop .35s ease}
.box.bad{border-color:var(--bad);animation:shake .4s ease}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.msg{min-height:1.8em;text-align:center;font-size:1.25rem;font-weight:700}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

.pad{display:grid;grid-template-columns:repeat(11,1fr);gap:5px;margin:14px 0 12px}
.pad button{border:2px solid var(--line);background:var(--card);border-radius:10px;min-height:48px;
  font-size:clamp(1rem,3.6vw,1.35rem);font-weight:700;padding:0}
.pad button:hover{border-color:var(--ink)}
.pad button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pad button:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:10px 22px;font-weight:700;font-size:1.1rem}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.link{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:var(--soft);padding:10px 8px}
[hidden]{display:none!important}

/* Family view */
.family{margin-top:22px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 16px}
.legend{text-align:center;font-size:1.3rem;font-weight:700;margin:0 0 12px}
.chip{display:inline-block;min-width:1.7em;padding:0 .3em;border-radius:.35em;text-align:center}
.chip.a{background:var(--a-bg);color:var(--a)} .chip.b{background:var(--b-bg);color:var(--b)} .chip.w{background:var(--w-bg);color:var(--w)}
.frame{max-width:360px;margin:0 auto 6px;display:grid;gap:5px}
.frow{display:flex;gap:10px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1}
.cell{aspect-ratio:1;border-radius:5px;background:var(--empty)}
.cell.a{background:var(--a)} .cell.b{background:var(--b)}
.ways{text-align:center;color:var(--soft);margin:10px 0 14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols.one{grid-template-columns:1fr}
.col h3{margin:0 0 6px;font-size:1rem;color:var(--soft);text-align:center;font-weight:700}
.fq{display:flex;justify-content:center;gap:.3em;font-size:clamp(1.15rem,4.6vw,1.6rem);font-weight:700;
  padding:5px 4px;border-radius:10px;margin-bottom:4px}
.fq .op{color:var(--soft);font-weight:400}
.fq .a{color:var(--a)} .fq .b{color:var(--b)} .fq .w{color:var(--w)}
.fq.current{background:var(--hi)}
.fq.blank span.n{display:inline-block;width:1.2em;border-bottom:3px dotted var(--line);color:transparent}
.fq.blank .op{opacity:.5}
.fq.fresh{animation:pop .35s ease}

/* Explore */
.intro{text-align:center;color:var(--soft);margin:18px 0 6px}
.steppers{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.stepper{display:flex;flex-direction:column;align-items:center;gap:4px}
.stepper .lbl{font-weight:700;color:var(--soft);font-size:.95rem}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper .val{font-size:2.6rem;font-weight:700;min-width:1.6em;text-align:center}
.stepper.a .val{color:var(--a)} .stepper.b .val{color:var(--b)} .stepper.w .val{color:var(--w)}
.stepper button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.4rem;font-weight:700}
.bigop{font-size:2.2rem;color:var(--soft);padding-top:22px}

/* Settings */
dialog{border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:20px;
  width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,20,35,.45)}
dialog h2{margin:0 0 6px;font-size:1.3rem}
dialog .note{color:var(--soft);margin:0 0 14px;font-size:.98rem}
.group{margin:0 0 14px}
.group .glbl{font-weight:700;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

@media (max-width:420px){
  .pad{gap:3px} .pad button{border-radius:8px;min-height:44px}
  .cols{gap:6px} .family{padding:14px 8px}
  .tabs button{padding:6px 10px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1 id="title">Number families</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabPractice" aria-selected="true"></button>
      <button role="tab" id="tabExplore" aria-selected="false"></button>
    </div>
    <button class="iconbtn" id="langBtn" aria-label="Language"></button>
    <button class="iconbtn" id="setBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="practice">
      <div class="status">
        <span class="stars" id="stars" aria-live="polite"></span>
        <span class="dots" id="dots"></span>
      </div>
      <div class="eq" id="eq" aria-live="polite"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="pad" id="pad"></div>
      <div class="actions" id="answerActions">
        <button class="btn" id="clearBtn"></button>
        <button class="btn primary" id="checkBtn"></button>
      </div>
      <div id="hint"></div>
      <div id="reveal" hidden>
        <div class="actions" style="margin-top:14px">
          <button class="btn link" id="showAllBtn"></button>
          <button class="btn" id="collectBtn"></button>
          <button class="btn primary" id="nextBtn"></button>
        </div>
        <div id="revealFamily"></div>
      </div>
    </section>

    <section id="explore" hidden>
      <p class="intro" id="exploreIntro"></p>
      <div class="steppers">
        <div class="stepper a"><span class="lbl" id="lblA"></span>
          <div class="ctl"><button id="aMinus" aria-label="minus">−</button><span class="val" id="aVal"></span><button id="aPlus" aria-label="plus">+</button></div></div>
        <span class="bigop" id="opSign">+</span>
        <div class="stepper b"><span class="lbl" id="lblB"></span>
          <div class="ctl"><button id="bMinus" aria-label="minus">−</button><span class="val" id="bVal"></span><button id="bPlus" aria-label="plus">+</button></div></div>
        <span class="bigop">=</span>
        <div class="stepper w"><span class="lbl" id="lblW"></span>
          <div class="ctl"><span class="val" id="wVal"></span></div></div>
      </div>
      <div id="exploreFamily"></div>
      <div class="actions" style="margin-top:14px"><button class="btn primary" id="practiceThisBtn"></button></div>
    </section>
  </main>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<dialog id="settings" aria-labelledby="setTitle">
  <h2 id="setTitle"></h2>
  <p class="note" id="setNote"></p>
  <div id="groups"></div>
  <div class="actions" style="justify-content:flex-end"><button class="btn primary" id="doneBtn"></button></div>
</dialog>

<script>
const T = {
  en:{
    title:"Number families", practice:"Practice", explore:"Explore", check:"Check", clear:"Clear",
    right:["Yes! That's right.","Great job!","Spot on!","You got it!","Warp speed!","To the stars!"],
    wrong1:"Not quite. Try again!", wrong2:"Count the blocks to help you.",
    next:"Next sum", nextRound:"Next in the family", collect:"Collect the whole family", showAll:"Show all",
    familyDone:"You collected the whole family!",
    legend:"{a} and {b} make {w}", ways:"One family, {n} ways to write it.", waysSame:"Both parts are the same, so there are only {n} ways.",
    got:"{k} of {n} found", adding:"Adding", taking:"Taking away",
    exploreIntro:"Pick two parts and see the whole family.", part:"Part", whole:"Whole", practiceThis:"Practice this family",
    setTitle:"Settings for grown-ups",
    setNote:"Every sum belongs to a family of three numbers. After each correct answer, your child can collect the other ways of writing the same sum.",
    max:"Numbers up to", ops:"Kinds of sums", both:"+ and −", missing:"Missing number", any:"Any number", result:"Only the result",
    layout:"Where the = goes", mix:"Mixed", cross:"Crossing ten, like 8 + 5", allow:"Allowed", avoid:"Avoid", done:"Done", lang:"EN",
    titleMul:"Multiplication table", mode:"Practice", modeFam:"Number families", modeMul:"Multiplication table", tables:"Tables up to", order:"Order", rowByRow:"Row by row", random:"Random",
    multiplying:"Multiplying", legendMul:"{a} times {b} is {w}"
  },
  hu:{
    title:"Számcsaládok", practice:"Gyakorlás", explore:"Felfedezés", check:"Ellenőrzés", clear:"Törlés",
    right:["Igen, ez az!","Ügyes vagy!","Pontosan!","Szuper!","Fénysebesség!","Irány a csillagok!"],
    wrong1:"Még nem jó. Próbáld újra!", wrong2:"Számold meg a kockákat, segítenek!",
    next:"Következő feladat", nextRound:"Következő családtag", collect:"Gyűjtsd össze az egész családot", showAll:"Mutasd mindet",
    familyDone:"Az egész család megvan!",
    legend:"{a} és {b} együtt {w}", ways:"Egy család, {n}-féle felírás.", waysSame:"A két rész egyforma, ezért csak {n}-féle felírás van.",
    got:"{k} / {n} megvan", adding:"Összeadás", taking:"Kivonás",
    exploreIntro:"Válassz két részt, és nézd meg az egész családot!", part:"Rész", whole:"Egész", practiceThis:"Gyakoroljuk ezt a családot",
    setTitle:"Beállítások felnőtteknek",
    setNote:"Minden feladat egy háromtagú számcsaládhoz tartozik. Minden jó válasz után a gyerek összegyűjtheti ugyanannak a feladatnak a többi felírását.",
    max:"Számkör", ops:"Műveletek", both:"+ és −", missing:"Hiányzó szám", any:"Bármelyik szám", result:"Csak az eredmény",
    layout:"Hol van az egyenlőségjel", mix:"Vegyes", cross:"Tízes átlépés, pl. 8 + 5", allow:"Lehet", avoid:"Nélküle", done:"Kész", lang:"HU",
    titleMul:"Szorzótábla", mode:"Gyakorlás módja", modeFam:"Számcsaládok", modeMul:"Szorzótábla", tables:"Szorzótábla eddig", order:"Sorrend", rowByRow:"Sorban", random:"Vegyesen",
    multiplying:"Szorzás", legendMul:"{a} szor {b} az {w}"
  },
  de:{
    title:"Zahlenfamilien", practice:"Üben", explore:"Entdecken", check:"Prüfen", clear:"Löschen",
    right:["Ja, genau!","Super gemacht!","Richtig!","Toll!","Warp-Geschwindigkeit!","Ab zu den Sternen!"],
    wrong1:"Noch nicht ganz. Versuch es noch mal!", wrong2:"Zähl die Klötzchen, das hilft dir.",
    next:"Nächste Aufgabe", nextRound:"Nächstes Familienmitglied", collect:"Sammle die ganze Familie", showAll:"Alle zeigen",
    familyDone:"Du hast die ganze Familie gesammelt!",
    legend:"{a} und {b} ergeben {w}", ways:"Eine Familie, {n} Schreibweisen.", waysSame:"Beide Teile sind gleich, deshalb gibt es nur {n} Schreibweisen.",
    got:"{k} von {n} gefunden", adding:"Plusaufgaben", taking:"Minusaufgaben",
    exploreIntro:"Wähle zwei Teile und sieh dir die ganze Familie an.", part:"Teil", whole:"Ganzes", practiceThis:"Diese Familie üben",
    setTitle:"Einstellungen für Erwachsene",
    setNote:"Jede Aufgabe gehört zu einer Familie aus drei Zahlen. Nach jeder richtigen Antwort kann Ihr Kind die anderen Schreibweisen derselben Aufgabe sammeln.",
    max:"Zahlenraum bis", ops:"Rechenarten", both:"+ und −", missing:"Fehlende Zahl", any:"Beliebige Zahl", result:"Nur das Ergebnis",
    layout:"Wo das = steht", mix:"Gemischt", cross:"Zehnerübergang, z. B. 8 + 5", allow:"Erlaubt", avoid:"Vermeiden", done:"Fertig", lang:"DE",
    titleMul:"Das kleine Einmaleins", mode:"Übungsart", modeFam:"Zahlenfamilien", modeMul:"Das kleine Einmaleins", tables:"Einmaleins bis", order:"Reihenfolge", rowByRow:"Reihe für Reihe", random:"Zufällig",
    multiplying:"Malaufgaben", legendMul:"{a} mal {b} ist {w}"
  }
};

const LANGS = Object.keys(T);
const nextLang = () => LANGS[(LANGS.indexOf(S.lang)+1) % LANGS.length];

const FORMS = [
  {t:['p','+','q','=','w'],op:'add',side:'end'},
  {t:['q','+','p','=','w'],op:'add',side:'end'},
  {t:['w','=','p','+','q'],op:'add',side:'start'},
  {t:['w','=','q','+','p'],op:'add',side:'start'},
  {t:['w','−','p','=','q'],op:'sub',side:'end'},
  {t:['w','−','q','=','p'],op:'sub',side:'end'},
  {t:['q','=','w','−','p'],op:'sub',side:'start'},
  {t:['p','=','w','−','q'],op:'sub',side:'start'},
];
const FORMS_MUL = [
  {t:['p','×','q','=','w'],op:'mul',side:'end',primary:true},
  {t:['q','×','p','=','w'],op:'mul',side:'end'},
  {t:['w','=','p','×','q'],op:'mul',side:'start',primary:true},
  {t:['w','=','q','×','p'],op:'mul',side:'start'},
];
const isMul = () => S.set.mode==='mul';
const formList = () => isMul() ? FORMS_MUL : FORMS;
const maxVal = () => isMul() ? 100 : S.set.max;
const ROLE_CLASS = {p:'a',q:'b',w:'w'};
const isNum = r => r==='p'||r==='q'||r==='w';

function load(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function save(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

const defaults = {mode:'add', max:20, ops:'both', missing:'any', layout:'mix', cross:true, tables:10, order:'random', mmissing:'result'};
const S = {
  lang: load('numfam-lang', null),
  set: Object.assign({}, defaults, load('numfam-settings', {})),
  tab: 'practice'
};
if(!T[S.lang]) S.lang = 'hu';
const P = {p:0,q:0,form:null,pos:0,input:'',tries:0,solved:false,stars:load('numfam-stars',0),last:'',round:null,queue:[],showAll:false,seq:null};
const E = {p:7,q:5};

const $ = s => document.querySelector(s);
const t = k => T[S.lang][k];
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const vals = (p,q) => ({p,q,w:isMul()?p*q:p+q});
const keyOf = (form,p,q) => { const v=vals(p,q); return form.t.map(r => isNum(r)?v[r]:r).join(' '); };

function family(p,q){
  const seen = new Set(), out = [];
  for(const f of formList()){ const k = keyOf(f,p,q); if(!seen.has(k)){ seen.add(k); out.push({form:f,key:k}); } }
  return out;
}
function unknownPos(form){
  if((isMul() ? S.set.mmissing : S.set.missing)==='result') return form.side==='end' ? 4 : 0;
  return pick([0,2,4]);
}

/* ---------- Practice ---------- */
function nextMulPair(){
  const n = S.set.tables, list = [];
  for(let a=1;a<=n;a++) for(let b=1;b<=10;b++) list.push([a,b]);
  if(S.set.order==='random'){
    let pr; do{ pr = pick(list); }while(list.length>1 && `${pr[0]},${pr[1]}`===P.last);
    return pr;
  }
  if(P.seq===null || P.seq>=list.length) P.seq = 0;
  return list[P.seq++];
}
function newSum(){
  if(isMul()){
    const [p,q] = nextMulPair();
    P.last = `${p},${q}`;
    let forms = FORMS_MUL.filter(f => (S.set.layout==='mix' || f.side===S.set.layout) && (S.set.order==='random' || f.primary));
    if(!forms.length) forms = FORMS_MUL.filter(f => f.primary);
    P.round = null; P.queue = [];
    return loadProblem(p,q,pick(forms));
  }
  const max = S.set.max;
  let p,q,tries=0;
  while(true){
    tries++;
    p = rand(0,max); q = rand(0,max-p);
    if(tries>400) break;
    if((p===0||q===0) && Math.random()<0.88) continue;
    if(!S.set.cross && (p%10)+(q%10)>10) continue;
    if(`${p},${q}`===P.last || `${q},${p}`===P.last) continue;
    break;
  }
  P.last = `${p},${q}`;
  let forms = FORMS.filter(f =>
    (S.set.ops==='both' || f.op===S.set.ops) &&
    (S.set.layout==='mix' || f.side===S.set.layout));
  if(!forms.length) forms = FORMS;
  P.round = null; P.queue = [];
  loadProblem(p,q,pick(forms));
}
function loadProblem(p,q,form){
  Object.assign(P,{p,q,form,pos:unknownPos(form),input:'',tries:0,solved:false,showAll:false});
  $('#msg').textContent=''; $('#msg').className='msg';
  $('#hint').innerHTML='';
  $('#reveal').hidden = true;
  $('#answerActions').hidden = false;
  renderPractice();
}
function answer(){ return vals(P.p,P.q)[P.form.t[P.pos]]; }

function renderPractice(state){
  const eq = $('#eq'); eq.innerHTML='';
  eq.classList.toggle('wide', maxVal()>20);
  const v = vals(P.p,P.q);
  P.form.t.forEach((r,i) => {
    const s = document.createElement('span');
    if(!isNum(r)){ s.className='op'; s.textContent=r; }
    else if(i===P.pos){
      s.className = 'box' + (P.input!==''?' filled':'') + (state?' '+state:'');
      s.textContent = P.input;
      s.setAttribute('aria-label', P.input===''?'?':P.input);
    } else { s.textContent = v[r]; }
    eq.appendChild(s);
  });
  $('#stars').textContent = P.stars ? '★ ' + P.stars : '';
  const dots = $('#dots'); dots.innerHTML='';
  if(P.round){
    for(let i=0;i<P.round.total;i++){ const d=document.createElement('span'); if(i<P.round.solved.size) d.className='on'; dots.appendChild(d); }
  }
  renderPad();
}
function renderPad(){
  if(maxVal()>20) return renderDigitPad();
  const pad = $('#pad'); pad.innerHTML='';
  const add = (n,col,row) => {
    const b = document.createElement('button');
    b.textContent = n; b.style.gridColumn = col; b.style.gridRow = row;
    b.setAttribute('aria-pressed', String(P.input===String(n)));
    b.disabled = P.solved;
    b.onclick = () => { if(P.solved) return; P.input = String(n); renderPractice(); };
    pad.appendChild(b);
  };
  add(0,1,1);
  for(let n=1;n<=10;n++) add(n,n+1,1);
  if(S.set.max>10) for(let n=11;n<=20;n++) add(n,n-9,2);
}
// Above 20 a button per number is too much: show digits 0-9 plus backspace.
function renderDigitPad(){
  const pad = $('#pad'); pad.innerHTML='';
  const add = (label,col,fn,aria) => {
    const b = document.createElement('button');
    b.textContent = label; b.style.gridColumn = col; b.style.gridRow = 1;
    if(aria) b.setAttribute('aria-label',aria);
    b.disabled = P.solved; b.onclick = fn;
    pad.appendChild(b);
  };
  add(0,1,()=>typeDigit('0'));
  for(let n=1;n<=9;n++) add(n,n+1,()=>typeDigit(String(n)));
  add('⌫',11,()=>{ if(P.solved) return; P.input=P.input.slice(0,-1); renderPractice(); },'Backspace');
}
function typeDigit(d){
  if(P.solved) return;
  let s = (P.input==='0' ? '' : P.input) + d;
  if(Number(s)>maxVal()) s = d;
  P.input = s; renderPractice();
}
function check(){
  if(P.solved || P.input==='') return;
  const msg = $('#msg');
  if(Number(P.input)===answer()){
    P.solved = true; P.stars++; save('numfam-stars', P.stars);
    const key = keyOf(P.form,P.p,P.q);
    if(P.round) P.round.solved.add(key);
    msg.className='msg ok';
    msg.textContent = (P.round && P.round.solved.size===P.round.total) ? t('familyDone') : pick(t('right'));
    $('#hint').innerHTML='';
    renderPractice('ok');
    showReveal(key);
    FX.play(P.round && P.round.solved.size===P.round.total);
  } else {
    P.tries++;
    msg.className='msg bad';
    msg.textContent = P.tries>=2 ? t('wrong2') : t('wrong1');
    renderPractice('bad');
    P.input='';
    setTimeout(()=>renderPractice(),450);
    if(P.tries>=2 && !$('#hint').firstChild){
      const f = document.createElement('div'); f.className='family';
      f.appendChild(frame(P.p,P.q)); $('#hint').appendChild(f);
    }
  }
}
function showReveal(key){
  $('#answerActions').hidden = true;
  $('#reveal').hidden = false;
  const solvedKeys = P.showAll ? null : (P.round ? P.round.solved : new Set([key]));
  const box = $('#revealFamily'); box.innerHTML='';
  box.appendChild(familyView(P.p,P.q,{solvedKeys,current:key,fresh:key}));
  const roundDone = P.round && P.round.solved.size===P.round.total;
  $('#collectBtn').hidden = !!P.round;
  $('#showAllBtn').hidden = P.showAll || roundDone || !!P.round;
  $('#nextBtn').textContent = (P.round && !roundDone) ? t('nextRound') : t('next');
}
function startRound(p,q,alreadySolvedKey){
  const fam = family(p,q);
  const solved = new Set(alreadySolvedKey ? [alreadySolvedKey] : []);
  P.round = {total:fam.length, solved};
  P.queue = shuffle(fam.filter(e => !solved.has(e.key)));
  nextFromQueue();
}
function nextFromQueue(){
  const e = P.queue.shift();
  const round = P.round;
  loadProblem(P.p===undefined?0:P.p, P.q, e.form);
  P.round = round;
  renderPractice();
}
function next(){
  if(P.round && P.queue.length){ nextFromQueue(); }
  else newSum();
}

/* ---------- Family view ---------- */
function chip(n,cls){ return `<span class="chip ${cls}">${n}</span>`; }
function frame(p,q){
  if(isMul()){
    const fr = document.createElement('div'); fr.className='frame';
    fr.setAttribute('aria-hidden','true');
    fr.style.gridTemplateColumns = `repeat(${q},1fr)`;
    fr.style.maxWidth = Math.min(360, q*36) + 'px';
    for(let i=0;i<p*q;i++){ const c = document.createElement('div'); c.className='cell a'; fr.appendChild(c); }
    return fr;
  }
  const max = Math.max(S.set.max, p+q>10?20:10);
  const fr = document.createElement('div'); fr.className='frame';
  fr.setAttribute('aria-hidden','true');
  let i=0;
  for(let r=0;r<max/10;r++){
    const row = document.createElement('div'); row.className='frow';
    for(let g=0;g<2;g++){
      const five = document.createElement('div'); five.className='five';
      for(let c=0;c<5;c++){
        const cell = document.createElement('div');
        cell.className = 'cell' + (i<p?' a':(i<p+q?' b':''));
        five.appendChild(cell); i++;
      }
      row.appendChild(five);
    }
    fr.appendChild(row);
  }
  return fr;
}
function familyView(p,q,{solvedKeys=null,current=null,fresh=null}={}){
  const v = vals(p,q);
  const wrap = document.createElement('div'); wrap.className='family';
  const lg = document.createElement('p'); lg.className='legend';
  lg.innerHTML = t(isMul()?'legendMul':'legend').replace('{a}',chip(p,'a')).replace('{b}',chip(q,'b')).replace('{w}',chip(v.w,'w'));
  wrap.appendChild(lg);
  wrap.appendChild(frame(p,q));
  const fam = family(p,q);
  const ways = document.createElement('p'); ways.className='ways';
  let txt = (p===q ? t('waysSame') : t('ways')).replace('{n}',fam.length);
  if(solvedKeys) txt += ' ' + t('got').replace('{k}',solvedKeys.size).replace('{n}',fam.length);
  ways.textContent = txt;
  wrap.appendChild(ways);
  const cols = document.createElement('div'); cols.className='cols' + (isMul()?' one':'');
  for(const op of (isMul() ? ['mul'] : ['add','sub'])){
    const col = document.createElement('div'); col.className='col';
    const h = document.createElement('h3'); h.textContent = op==='add'?t('adding'):op==='sub'?t('taking'):t('multiplying'); col.appendChild(h);
    for(const e of fam.filter(x=>x.form.op===op)){
      const row = document.createElement('div');
      const hidden = solvedKeys && !solvedKeys.has(e.key);
      row.className = 'fq' + (hidden?' blank':'') + (e.key===current?' current':'') + (e.key===fresh&&!hidden?' fresh':'');
      e.form.t.forEach(r=>{
        const s=document.createElement('span');
        if(isNum(r)){ s.className='n '+ROLE_CLASS[r]; s.textContent=v[r]; }
        else { s.className='op'; s.textContent=r; }
        row.appendChild(s);
      });
      if(hidden) row.setAttribute('aria-label','?');
      col.appendChild(row);
    }
    cols.appendChild(col);
  }
  wrap.appendChild(cols);
  return wrap;
}

/* ---------- Explore ---------- */
const lo = () => isMul() ? 1 : 0;
const canGrow = k => isMul() ? E[k]<10 : E.p+E.q<S.set.max;
function renderExplore(){

/* ---------- Space celebrations ---------- */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const TAU = Math.PI*2, INK = '#15202E';
  const NEON = ['#00C8FF','#FF3EA5','#FFC21A','#4BE38A','#A06BFF','#FF7A1A'];
  let W = 0, H = 0, dpr = 1, running = [], raf = 0, bag = [], last = '';

  const R = (a,b) => a + Math.random()*(b-a);
  const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
  const seg = (k,a,b) => clamp((k-a)/(b-a), 0, 1);
  const lerp = (a,b,u) => a + (b-a)*u;
  const easeOut = u => 1 - Math.pow(1-u, 3);
  const easeIn = u => u*u*u;
  const easeInOut = u => u<.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
  const backOut = u => { const c = 1.7, v = u-1; return 1 + (c+1)*v*v*v + c*v*v; };
  const fade = (k,a,b) => k<a ? k/a : k>1-b ? (1-k)/b : 1;
  const bz = (a,b,c,u) => ({x:(1-u)*(1-u)*a.x + 2*(1-u)*u*b.x + u*u*c.x, y:(1-u)*(1-u)*a.y + 2*(1-u)*u*b.y + u*u*c.y});
  const neon = () => pick(NEON);
  const minSide = () => Math.min(W, H);

  function resize(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  }
  addEventListener('resize', resize); resize();

  /* Drawing helpers */
  function glow(x,y,r,c){
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,c); g.addColorStop(1,c+'00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
  function star(x,y,r,rot,c){
    ctx.beginPath();
    for(let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r, a = rot + i*Math.PI/5 - Math.PI/2; ctx.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
    ctx.closePath(); ctx.fillStyle = c; ctx.fill();
  }
  function sparkle(x,y,r,c){
    ctx.beginPath(); ctx.moveTo(x,y-r);
    ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
    ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r);
    ctx.fillStyle = c; ctx.fill();
  }
  function gem(x,y,sz,rot,c){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz*.7,-sz*.3); ctx.lineTo(sz*.45,sz); ctx.lineTo(-sz*.45,sz); ctx.lineTo(-sz*.7,-sz*.3); ctx.closePath();
    ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-sz*.8); ctx.lineTo(-sz*.4,-sz*.25); ctx.lineTo(0,sz*.2); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    ctx.restore();
  }
  // Little starship, nose pointing along +x.
  function ship(x,y,s,ang,c,flame=true){
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(s,s);
    if(flame){
      const f = 16 + Math.random()*12, g = ctx.createLinearGradient(-18,0,-18-f,0);
      g.addColorStop(0,'#FFF6B0'); g.addColorStop(.35,'#FF9A1A'); g.addColorStop(1,'#FF3C0000');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-17,-6); ctx.lineTo(-18-f,0); ctx.lineTo(-17,6); ctx.closePath(); ctx.fill();
    }
    ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
    for(const sg of [-1,1]){
      ctx.beginPath(); ctx.moveTo(4,6*sg); ctx.lineTo(-12,26*sg); ctx.lineTo(-21,26*sg); ctx.lineTo(-15,6*sg); ctx.closePath();
      ctx.fillStyle = c; ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(32,0); ctx.quadraticCurveTo(12,-12,-18,-8); ctx.lineTo(-18,8); ctx.quadraticCurveTo(12,12,32,0); ctx.closePath();
    ctx.fillStyle = '#E9EFF6'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = c; ctx.fillRect(-16,-2.5,18,5);
    ctx.beginPath(); ctx.ellipse(13,0,7,4.5,0,0,TAU); ctx.fillStyle = '#3BE0FF'; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function bumpStars(){
    const el = $('#stars'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }

  /* Effects: each returns {dur, draw(k)} with k running 0 → 1 */
  const KINDS = {
    // Hyperspace jump: star streaks rush outward, a ship bursts out of the middle.
    warp(){
      const cx = W*R(.3,.7), cy = H*R(.22,.42), maxR = Math.hypot(W,H)*.8;
      const st = Array.from({length:Math.round(clamp(W*H/6500,60,170))},
        () => ({a:R(0,TAU), d:Math.random(), sp:R(.5,1.3), c:neon(), w:R(1.5,3.5)}));
      const col = neon(), dir = Math.random()<.5 ? -1 : 1;
      return {dur:2800, draw(k){
        ctx.globalAlpha = .85*fade(k,.12,.2);
        const tail = .03 + .22*Math.sin(Math.PI*k);
        ctx.lineCap = 'round';
        for(const s of st){
          const z = (s.d + k*s.sp*1.6) % 1, z0 = Math.max(0, z-tail);
          const r1 = maxR*z*z + 1, r0 = maxR*z0*z0, ca = Math.cos(s.a), sa = Math.sin(s.a);
          ctx.strokeStyle = s.c; ctx.lineWidth = s.w*(.4+z);
          ctx.beginPath(); ctx.moveTo(cx+ca*r0, cy+sa*r0); ctx.lineTo(cx+ca*r1, cy+sa*r1); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        const u = seg(k,.3,1);
        if(u>0){
          const e = easeIn(u), tx = cx + dir*W*.45, ty = H*1.1;
          ship(lerp(cx,tx,e), lerp(cy,ty,e), .15 + e*3.2, Math.atan2(ty-cy, tx-cx), col);
        }
      }};
    },

    // A ship swoops across the screen with a sparkly trail, sometimes doing a barrel roll.
    flyby(){
      const dir = Math.random()<.5 ? 1 : -1, s = clamp(minSide()/260,1.1,2.4);
      const p0 = {x:dir>0 ? -90*s : W+90*s, y:H*R(.15,.7)};
      const p2 = {x:dir>0 ? W+90*s : -90*s, y:H*R(.1,.7)};
      const p1 = {x:W*R(.3,.7), y:H*R(-.1,.9)};
      const col = neon(), trail = [neon(), neon(), '#FFD84A'], roll = Math.random()<.6;
      return {dur:2600, draw(k){
        for(let i=1;i<=30;i++){
          const u = k - i*.011; if(u<0) break;
          const q = bz(p0,p1,p2,u), f = 1 - i/30;
          ctx.globalAlpha = f;
          sparkle(q.x + Math.sin(i*7.3)*i*.5*s, q.y + Math.cos(i*5.1)*i*.5*s, (3 + f*6)*s, trail[i%3]);
        }
        ctx.globalAlpha = 1;
        const q = bz(p0,p1,p2,k), q2 = bz(p0,p1,p2,Math.min(1,k+.01));
        ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(Math.atan2(q2.y-q.y, q2.x-q.x));
        if(roll) ctx.scale(1, Math.cos(seg(k,.35,.65)*TAU));
        ship(0,0,s,0,col);
        ctx.restore();
      }};
    },

    // A ringed alien planet rises from the bottom; a moon and a tiny ship orbit it.
    planet(){
      const r = clamp(minSide()*R(.16,.24),60,190), cx = W*R(.2,.8), hue = Math.round(R(0,360));
      const base = `hsl(${hue} 80% 58%)`, dark = `hsl(${hue} 70% 34%)`, light = `hsl(${(hue+40)%360} 90% 76%)`;
      const ringC = `hsl(${(hue+180)%360} 85% 66%)`, tilt = R(-.45,.45), hasRing = Math.random()<.75;
      const bands = Array.from({length:rand(3,5)}, () => ({y:R(-.9,.8), h:R(.08,.22), c:Math.random()<.5 ? light : dark}));
      const craters = Array.from({length:rand(2,4)}, () => ({x:R(-.5,.5), y:R(-.5,.5), r:R(.08,.16)}));
      const twinkles = Array.from({length:10}, () => ({a:R(0,TAU), d:R(1.3,2.4), c:neon(), ph:R(0,TAU)}));
      const moonC = neon(), shipC = neon();
      return {dur:3200, draw(k){
        const up = easeOut(seg(k,0,.3)) * (1 - easeIn(seg(k,.78,1)));
        const cy = H + r*1.15 - up*(r*2 + Math.min(H*.12,80));
        const ring = front => {
          if(!hasRing) return;
          ctx.save(); ctx.translate(cx,cy); ctx.rotate(tilt); ctx.strokeStyle = ringC;
          for(const [rx,lw,al] of [[1.75,.13,.9],[1.45,.05,.7]]){
            ctx.globalAlpha = al; ctx.lineWidth = r*lw; ctx.beginPath();
            ctx.ellipse(0,0,r*rx,r*rx*.24,0, front ? 0 : Math.PI, front ? Math.PI : TAU); ctx.stroke();
          }
          ctx.restore();
        };
        const ma = k*TAU*1.3, moonFront = Math.sin(ma) > 0;
        const moon = () => {
          const mx = cx + Math.cos(ma)*r*2.1, my = cy - r*.35 + Math.sin(ma)*r*.45;
          ctx.beginPath(); ctx.arc(mx,my,r*.16,0,TAU); ctx.fillStyle = moonC; ctx.fill();
          ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
        };
        for(const tw of twinkles){
          ctx.globalAlpha = up * (.5 + .5*Math.sin(k*18 + tw.ph));
          sparkle(cx + Math.cos(tw.a)*r*tw.d, cy - r*.4 + Math.sin(tw.a)*r*tw.d*.7, 7, tw.c);
        }
        ctx.globalAlpha = 1;
        ring(false);
        if(!moonFront) moon();
        ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.clip();
        const g = ctx.createRadialGradient(cx-r*.4,cy-r*.4,r*.1,cx,cy,r);
        g.addColorStop(0,light); g.addColorStop(.5,base); g.addColorStop(1,dark);
        ctx.fillStyle = g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
        ctx.globalAlpha = .45;
        for(const b of bands){ ctx.fillStyle = b.c; ctx.fillRect(cx-r, cy+b.y*r, r*2, b.h*r); }
        ctx.globalAlpha = .35; ctx.fillStyle = dark;
        for(const c of craters){ ctx.beginPath(); ctx.arc(cx+c.x*r, cy+c.y*r, c.r*r, 0, TAU); ctx.fill(); }
        ctx.restore();
        ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
        ring(true);
        if(moonFront) moon();
        const sa = -k*TAU*1.6, sx = cx + Math.cos(sa)*r*1.6, sy = cy - r*1.35 + Math.sin(sa)*r*.3;
        ship(sx, sy, clamp(r/110,.6,1.2), Math.atan2(Math.cos(sa)*-.3, Math.sin(sa)*1.6), shipC);
      }};
    },

    // Star fireworks shooting up and bursting into little stars.
    fireworks(){
      const rise = .45, life = 1.5, burst = [];
      let t = .05;
      for(let i=0, n=rand(3,5); i<n; i++){
        const v = clamp(minSide()*.45,140,320);
        burst.push({t, x:W*R(.12,.88), y:H*R(.12,.5), c:[neon(),neon()],
          p:Array.from({length:28}, (_,j) => ({a:j/28*TAU + R(-.1,.1), v:R(.55,1)*v, rot:R(0,TAU), spin:R(-6,6), r:R(6,11)}))});
        t += R(.22,.38);
      }
      const dur = (burst[burst.length-1].t + rise + life)*1000;
      return {dur, draw(k){
        const T = k*dur/1000;
        for(const b of burst){
          const tl = T - b.t; if(tl<0) continue;
          if(tl<rise){
            const y = lerp(H+10, b.y, easeOut(tl/rise));
            for(let i=0;i<6;i++){ ctx.globalAlpha = 1 - i/6; sparkle(b.x, y + i*10, 5 - i*.6, b.c[0]); }
            continue;
          }
          const tp = tl - rise; if(tp>life) continue;
          const a = 1 - tp/life;
          ctx.globalAlpha = a;
          if(tp<.18) glow(b.x, b.y, 70*(1 - tp/.18) + 10, '#FFF3B0');
          const d = (1 - Math.exp(-tp*2.2))/2.2, fall = 70*tp*tp;
          b.p.forEach((p,j) => star(b.x + Math.cos(p.a)*p.v*d, b.y + Math.sin(p.a)*p.v*d + fall, p.r*(.6 + .4*a), p.rot + p.spin*tp, b.c[j%2]));
        }
      }};
    },

    // A cute alien creature pops up, hops, blinks and waves.
    alien(){
      const s = clamp(minSide()*.13,55,115), x = W*R(.15,.85), hue = Math.round(R(0,360));
      const body = `hsl(${hue} 75% 60%)`, belly = `hsl(${hue} 85% 82%)`, spot = `hsl(${(hue+150)%360} 70% 55%)`;
      const eyes = rand(1,3), look = x < W/2 ? 1 : -1;
      const spots = Array.from({length:rand(2,5)}, () => ({x:R(-.55,.55), y:R(-.7,.05), r:R(.07,.14)}));
      return {dur:3000, draw(k){
        const up = backOut(seg(k,0,.22)) * (1 - easeIn(seg(k,.8,1)));
        const hk = seg(k,.3,.72), hop = hk>0 && hk<1 ? Math.abs(Math.sin(hk*Math.PI*2))*s*.55 : 0;
        const by = H + s*1.3 - up*s*2.3 - hop, w = Math.sin(k*TAU*3)*.05;
        const ol = Math.max(2.5, s*.05);
        const limb = (x1,y1,x2,y2,lw) => {
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
          ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
          ctx.lineWidth = lw - ol*2; ctx.strokeStyle = body; ctx.stroke();
        };
        for(const sg of [-1,1]){
          const wave = sg>0 ? Math.sin(k*TAU*5)*.7 - .6 : .5;
          const ax = x + sg*s*.72, ay = by - s*.1;
          limb(ax, ay, ax + sg*Math.cos(wave)*s*.55, ay + Math.sin(wave)*s*.55, s*.2);
        }
        const blink = (k>.25 && k<.28) || (k>.55 && k<.6);
        const tips = [];
        for(let i=0;i<eyes;i++){
          const off = (i - (eyes-1)/2)*s*.5, sway = Math.sin(k*TAU*2 + i*1.7)*s*.12;
          const tx = x + off + sway, ty = by - s*1.55 - (eyes===3 && i===1 ? s*.2 : 0);
          limb(x + off*.6, by - s*.7, tx, ty, s*.16);
          tips.push([tx,ty]);
        }
        ctx.lineWidth = ol; ctx.strokeStyle = INK;
        ctx.beginPath(); ctx.ellipse(x, by, s*.85*(1+w), s*(1-w), 0, 0, TAU); ctx.fillStyle = body; ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x, by + s*.4, s*.5, s*.42, 0, 0, TAU); ctx.fillStyle = belly; ctx.fill();
        ctx.fillStyle = spot;
        for(const sp of spots){ ctx.beginPath(); ctx.arc(x + sp.x*s, by + sp.y*s, sp.r*s, 0, TAU); ctx.fill(); }
        ctx.fillStyle = 'rgba(255,110,150,.55)';
        for(const sg of [-1,1]){ ctx.beginPath(); ctx.arc(x + sg*s*.45, by - s*.05, s*.09, 0, TAU); ctx.fill(); }
        ctx.lineCap = 'round';
        if(hop > s*.1){
          ctx.beginPath(); ctx.ellipse(x, by - s*.02, s*.17, s*.14, 0, 0, TAU); ctx.fillStyle = INK; ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(x, by - s*.2, s*.25, .2*Math.PI, .8*Math.PI); ctx.stroke();
        }
        for(const [tx,ty] of tips){
          ctx.beginPath(); ctx.arc(tx, ty, s*.22, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.stroke();
          if(blink){ ctx.beginPath(); ctx.moveTo(tx - s*.14, ty); ctx.lineTo(tx + s*.14, ty); ctx.stroke(); }
          else { ctx.beginPath(); ctx.arc(tx + look*s*.07, ty + s*.02, s*.1, 0, TAU); ctx.fillStyle = INK; ctx.fill(); }
        }
      }};
    },

    // A portal ring lights up glyph by glyph, swirls open and launches a ship.
    portal(){
      const R0 = clamp(minSide()*.17,70,170), cx = W*R(.25,.75), cy = H*R(.25,.5);
      const glyphs = 16, col = neon(), shipC = neon(), exitA = R(0,TAU), maxD = Math.hypot(W,H);
      return {dur:3200, draw(k){
        const sc = backOut(seg(k,0,.15)) * (1 - easeIn(seg(k,.82,1)));
        if(sc>0){
          ctx.save(); ctx.translate(cx,cy); ctx.scale(sc,sc);
          const open = easeOut(seg(k,.35,.5));
          if(open>0){
            ctx.save(); ctx.beginPath(); ctx.arc(0,0,R0*.82,0,TAU); ctx.clip();
            ctx.globalAlpha = open;
            const g = ctx.createRadialGradient(0,0,0,0,0,R0*.82);
            g.addColorStop(0,'#FFFFFF'); g.addColorStop(.35,col); g.addColorStop(1,'#2A0B4A');
            ctx.fillStyle = g; ctx.fillRect(-R0,-R0,R0*2,R0*2);
            ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            for(let arm=0; arm<4; arm++){
              ctx.beginPath();
              for(let u=0; u<=1.001; u+=.05){ const a = arm*TAU/4 + u*4 + k*14, rr = R0*.82*u; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
              ctx.stroke();
            }
            ctx.restore();
          }
          ctx.lineWidth = R0*.2; ctx.strokeStyle = '#3A4658';
          ctx.beginPath(); ctx.arc(0,0,R0*.92,0,TAU); ctx.stroke();
          ctx.lineWidth = 3; ctx.strokeStyle = INK;
          for(const rr of [1.02,.82]){ ctx.beginPath(); ctx.arc(0,0,R0*rr,0,TAU); ctx.stroke(); }
          const lit = seg(k,.05,.38)*glyphs;
          for(let i=0;i<glyphs;i++){
            const a = i/glyphs*TAU - Math.PI/2, px = Math.cos(a)*R0*.92, py = Math.sin(a)*R0*.92;
            if(i<lit){ glow(px,py,R0*.14,col); sparkle(px,py,R0*.07,'#FFFFFF'); }
            else { ctx.beginPath(); ctx.arc(px,py,R0*.035,0,TAU); ctx.fillStyle = '#6B7890'; ctx.fill(); }
          }
          ctx.restore();
        }
        const u = seg(k,.5,.95);
        if(u>0){ const e = easeIn(u); ship(cx + Math.cos(exitA)*e*maxD, cy + Math.sin(exitA)*e*maxD, lerp(.2,2.6,e), exitA, shipC); }
      }};
    },

    // A shower of glowing comets.
    meteors(){
      const dir = Math.random()<.5 ? 1 : -1, th = R(.5,.9), L = Math.hypot(W,H)*1.1;
      const vx = -dir*Math.cos(th), vy = Math.sin(th);
      const ms = Array.from({length:rand(14,22)}, () => ({
        x:(dir>0 ? R(.1,1.4) : R(-.4,.9))*W, y:-30 - R(0,H*.3),
        t:R(0,.55), d:R(.35,.6), r:R(3,7)*clamp(minSide()/400,1,1.8), c:neon()}));
      return {dur:2800, draw(k){
        ctx.lineCap = 'round';
        for(const m of ms){
          const u = (k - m.t)/m.d; if(u<0 || u>1) continue;
          const hx = m.x + vx*L*u, hy = m.y + vy*L*u, tl = L*.2;
          const g = ctx.createLinearGradient(hx, hy, hx - vx*tl, hy - vy*tl);
          g.addColorStop(0,m.c); g.addColorStop(1,m.c+'00');
          ctx.strokeStyle = g; ctx.lineWidth = m.r*1.6;
          ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx - vx*tl, hy - vy*tl); ctx.stroke();
          glow(hx, hy, m.r*4, m.c);
          ctx.beginPath(); ctx.arc(hx, hy, m.r, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        }
      }};
    },

    // Mining run: a ship lasers an asteroid, it cracks into crystals that fly into the star counter.
    mining(){
      const side = Math.random()<.5 ? 1 : -1, m = minSide(), s = clamp(m/280,1,2);
      const ax = W*(.5 + side*R(.15,.28)), ay = H*R(.22,.42), ar = clamp(m*.09,34,80);
      const sx0 = W*.5 - side*(W*.5 + 60*s), sx1 = W*.5 - side*W*R(.2,.3), sy = ay + R(-.12,.12)*H;
      const lumps = Array.from({length:12}, () => ar*R(.78,1.08));
      const craters = Array.from({length:3}, () => ({x:R(-.4,.4), y:R(-.4,.4), r:R(.12,.22)}));
      const rocks = Array.from({length:7}, () => ({a:R(0,TAU), v:R(.6,1.2)*m*.35, r:R(.15,.3)*ar, spin:R(-5,5)}));
      const gems = Array.from({length:16}, (_,i) => ({a:i/16*TAU + R(-.2,.2), d:R(.5,1)*m*.22, c:neon(), sz:R(7,12)*s*.8, rot:R(0,TAU), delay:R(0,.12)}));
      const col = neon(), ang0 = Math.atan2(ay-sy, ax-sx1);
      let bumped = false, tgt = null;
      const rockPath = (x,y,rad,sc) => {
        ctx.beginPath();
        lumps.forEach((l,i) => { const a = i/lumps.length*TAU; ctx.lineTo(x + Math.cos(a)*l*sc*rad/ar, y + Math.sin(a)*l*sc*rad/ar); });
        ctx.closePath();
      };
      return {dur:3600, draw(k){
        let px, py, pa = ang0;
        if(k<.75){ px = lerp(sx0, sx1, easeOut(seg(k,0,.2))); py = sy + Math.sin(k*20)*3; }
        else { const e = easeIn(seg(k,.75,1)); px = lerp(sx1, sx1 + side*W*1.1, e); py = lerp(sy, sy - H*.5, e); pa = Math.atan2(-H*.5, side*W*1.1); }
        const heat = seg(k,.2,.46);
        if(k>.2 && k<.46){
          const nx = px + Math.cos(pa)*32*s, ny = py + Math.sin(pa)*32*s;
          const hx = ax - Math.cos(ang0)*ar*.8, hy = ay - Math.sin(ang0)*ar*.8;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#FF3E7A'; ctx.lineWidth = 7 + Math.random()*4;
          ctx.beginPath(); ctx.moveTo(nx,ny); ctx.lineTo(hx,hy); ctx.stroke();
          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5; ctx.stroke();
          for(let i=0;i<4;i++) sparkle(hx + R(-14,14), hy + R(-14,14), R(4,9), pick(['#FFD84A','#FF7A1A','#FFFFFF']));
        }
        if(k<.46){
          const sh = heat*4, x = ax + R(-sh,sh), y = ay + R(-sh,sh);
          rockPath(x, y, ar, 1); ctx.fillStyle = '#8B7B6B'; ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
          ctx.fillStyle = '#6E6053';
          for(const c of craters){ ctx.beginPath(); ctx.arc(x + c.x*ar, y + c.y*ar, c.r*ar, 0, TAU); ctx.fill(); }
          if(heat>0){ ctx.globalAlpha = heat*.8; glow(x, y, ar*1.2, '#FF7A1A'); ctx.globalAlpha = 1; }
        } else {
          if(!tgt){ const r = $('#stars').getBoundingClientRect(); tgt = r.width ? {x:r.left + r.width/2, y:r.top + r.height/2} : {x:40, y:40}; }
          const b = seg(k,.46,.58);
          if(b<1) glow(ax, ay, ar*3*(1-b) + 1, '#FFF3B0');
          const tr = seg(k,.46,.8);
          if(tr<1){
            ctx.globalAlpha = 1 - tr;
            for(const r of rocks){
              const d = easeOut(tr)*r.v, x = ax + Math.cos(r.a)*d, y = ay + Math.sin(r.a)*d;
              ctx.save(); ctx.translate(x,y); ctx.rotate(r.spin*tr);
              ctx.fillStyle = '#8B7B6B'; ctx.fillRect(-r.r/2,-r.r/2,r.r,r.r);
              ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.strokeRect(-r.r/2,-r.r/2,r.r,r.r);
              ctx.restore();
            }
            ctx.globalAlpha = 1;
          }
          for(const g of gems){
            const u1 = easeOut(seg(k,.46,.6)), p1 = {x:ax + Math.cos(g.a)*g.d*u1, y:ay + Math.sin(g.a)*g.d*u1};
            const u2 = seg(k, .62 + g.delay, .88 + g.delay*.5);
            if(u2>=1) continue;
            const e = easeInOut(u2), ctl = {x:(p1.x + tgt.x)/2, y:Math.min(p1.y, tgt.y) - m*.2};
            const q = u2>0 ? bz(p1, ctl, tgt, e) : p1;
            gem(q.x, q.y, g.sz*(1 - .6*seg(u2,.7,1)), g.rot + k*6, g.c);
          }
          if(!bumped && k>.9){ bumped = true; bumpStars(); }
        }
        ship(px, py, s, pa, col, k<.2 || k>.75);
      }};
    },
  };

  function loop(now){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    running = running.filter(fx => {
      const k = (now - fx.t0)/fx.dur;
      if(k>=1) return false;
      ctx.save(); fx.draw(Math.max(0,k)); ctx.restore();
      return true;
    });
    raf = running.length ? requestAnimationFrame(loop) : 0;
  }
  function add(fx){
    fx.t0 = performance.now();
    running.push(fx);
    if(running.length>3) running.shift();
    if(!raf) raf = requestAnimationFrame(loop);
  }
  // Shuffle-bag so every celebration shows up before any repeats.
  function nextKind(){
    if(!bag.length){ bag = shuffle(Object.keys(KINDS)); if(bag[0]===last) bag.push(bag.shift()); }
    return last = bag.shift();
  }
  function play(big){
    if(reduce.matches) return;
    if(!W || !H) resize();
    const kind = nextKind();
    add(KINDS[kind]());
    if(big) add(KINDS[kind==='fireworks' ? 'meteors' : 'fireworks']());
  }
  return {play};
})();

/* ---------- Wiring ---------- */
function setTab(tab){
  S.tab=tab;
  $('#tabPractice').setAttribute('aria-selected',String(tab==='practice'));
  $('#tabExplore').setAttribute('aria-selected',String(tab==='explore'));
  $('#practice').hidden = tab!=='practice';
  $('#explore').hidden = tab!=='explore';
  if(tab==='explore') renderExplore();
}
function updateTitle(){
  const s = t(isMul() ? 'titleMul' : 'title');
  document.title = s; $('#title').textContent = s;
}
function applyLang(){
  document.documentElement.lang = S.lang;
  updateTitle();
  $('#tabPractice').textContent=t('practice'); $('#tabExplore').textContent=t('explore');
  $('#langBtn').textContent = T[nextLang()].lang;
  $('#checkBtn').textContent=t('check'); $('#clearBtn').textContent=t('clear');
  $('#collectBtn').textContent=t('collect'); $('#showAllBtn').textContent=t('showAll');
  $('#exploreIntro').textContent=t('exploreIntro');
  $('#lblA').textContent=t('part'); $('#lblB').textContent=t('part'); $('#lblW').textContent=t('whole');
  $('#practiceThisBtn').textContent=t('practiceThis');
  $('#setTitle').textContent=t('setTitle'); $('#setNote').textContent=t('setNote'); $('#doneBtn').textContent=t('done');
  if(P.solved) showReveal(keyOf(P.form,P.p,P.q));
  if(S.tab==='explore') renderExplore();
  if($('#settings').open) renderSettings();
}
$('#langBtn').onclick=()=>{ S.lang = nextLang(); save('numfam-lang',S.lang); applyLang(); };
$('#tabPractice').onclick=()=>setTab('practice');
$('#tabExplore').onclick=()=>setTab('explore');
$('#checkBtn').onclick=check;
$('#clearBtn').onclick=()=>{ P.input=''; renderPractice(); };
$('#nextBtn').onclick=next;
$('#collectBtn').onclick=()=>startRound(P.p,P.q,keyOf(P.form,P.p,P.q));
$('#showAllBtn').onclick=()=>{ P.showAll=true; showReveal(keyOf(P.form,P.p,P.q)); };

document.addEventListener('keydown',e=>{
  if($('#settings').open || S.tab!=='practice') return;
  if(e.target.tagName==='BUTTON' && e.key==='Enter') return;
  if(/^[0-9]$/.test(e.key)){ typeDigit(e.key); e.preventDefault(); }
  else if(e.key==='Backspace'){ if(!P.solved){ P.input=P.input.slice(0,-1); renderPractice(); } e.preventDefault(); }
  else if(e.key==='Enter'){ P.solved ? next() : check(); e.preventDefault(); }
});

applyLang();
newSum();
</script>
